[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "dallas-crime-analysis"
version = "0.1.0"
description = "Reproducible Dallas crime and housing analysis pipeline in Python."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "libpysal>=4.9",
  "matplotlib>=3.9",
  "numpy>=2.2",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "spreg>=1.7",
  "statsmodels>=0.14",
  "typer>=0.16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]

[project.scripts]
dallas-crime = "dallas_crime.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dallas_crime"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
